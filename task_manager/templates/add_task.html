{% extends "base.html" %}
{% block title %} Add task {% endblock %}
{% block content %}
<main>
    <h3>Добавить задачу</h3>
    <form method="POST" action="{{ url_for('add_view') }}">
        {{ form.hidden_tag() }}
        <p>
            {{ form.title.label }}
            {{ form.title() }}
        </p>
        <p>{{ form.submit() }}</p>
    </form>
</main>
{% endblock %}
